{{ define "main" }}
  <div class="container mx-auto max-w-7xl px-4 py-12 md:py-16">
    <div class="grid gap-10 md:grid-cols-[minmax(0,1fr)_16rem] lg:grid-cols-[minmax(0,1fr)_18rem]">
      <div class="@container">
        <header class="flex flex-col gap-3">
          <p class="text-sm text-muted-foreground">
            <a href="{{ (printf "/%s" .Type) | relLangURL }}" class="transition-colors hover:text-foreground">
              {{ .Type | humanize }}
            </a>
          </p>
          <h1 class="text-3xl font-bold tracking-tight md:text-4xl">{{ .Title }}</h1>
          <p class="text-sm text-muted-foreground">
            {{ len .RegularPages }} {{ i18n "postsCount" | default "posts" }}
          </p>
        </header>

        {{- with .Content }}
          <div class="prose-shadcn mt-6">{{ . }}</div>
        {{- end }}

        {{ partial "post-list.html" (dict "pages" .RegularPages "page" .) }}
      </div>

      {{ partial "sidebar.html" . }}
    </div>
  </div>
{{ end }}
