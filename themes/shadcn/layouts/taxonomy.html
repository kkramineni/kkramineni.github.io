{{ define "main" }}
  <div class="container mx-auto max-w-4xl px-4 py-12 md:py-16">
    <header class="flex flex-col gap-3">
      <h1 class="text-3xl font-bold tracking-tight md:text-4xl">
        {{ with .Site.Params.taxonomyTitles }}{{ index . $.Title | default $.Title }}{{ else }}{{ .Title }}{{ end }}
      </h1>
      {{- with .Content }}
        <div class="prose-shadcn text-lg text-muted-foreground">{{ . }}</div>
      {{- end }}
    </header>

    {{- with .Data.Terms.ByCount }}
      <div class="mt-10 flex flex-wrap gap-2">
        {{- range . }}
          <a
            href="{{ .Page.RelPermalink }}"
            class="badge badge-secondary gap-1.5 hover:bg-primary hover:text-primary-foreground"
          >
            {{ .Page.Title }}
            <span class="opacity-60">{{ .Count }}</span>
          </a>
        {{- end }}
      </div>
    {{- end }}
  </div>
{{ end }}
